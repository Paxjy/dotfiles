logLevel: debug

# --- Global Macros ---
macros:
  "bin": "/home/davpace/llama.cpp/build/bin/llama-server"
  "base_args": >
    --fit on
    --no-warmup
    -fa on --port ${PORT} --host 0.0.0.0
    --batch-size 2048 --ubatch-size 1024 --kv-unified -np 1
    -ctk q8_0 
    -ctv q8_0
    --threads 12 --threads-batch 12
    --jinja
    --webui-mcp-proxy
  "model_dir": "/home/davpace/Models"



# ----------------------------------------------------------------------------------------------------------------

models:

# Qwen  Models

  "Qwen3.8-27b":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --model ${model_dir}/Qwen3.8-27B/Qwen3.8-27B-UD-Q4_K_M.gguf
      #--mmproj ${model_dir}/Qwen3.8-27B/mmproj-BF16.gguf
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --ctx-size 128000
      --spec-type draft-mtp --spec-draft-n-max 2
      --chat-template-kwargs '{"preserve_thinking": true, "reasoning_effort":"xhigh"}'
      #--no-mmproj-offload
      #--image-min-tokens 1024
      --chat-template-file ${model_dir}/Qwen3.8-27B/Qwen3.8.unsloth.fixed.chat_template

  "Qwen3.8-27b-no-mtp":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --model ${model_dir}/Qwen3.8-27B/Qwen3.8-27B-UD-Q4_K_M.gguf
      #--mmproj ${model_dir}/Qwen3.8-27B/mmproj-BF16.gguf
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --ctx-size 128000
      --chat-template-kwargs '{"preserve_thinking": true, "reasoning_effort":"xhigh"}'
      #--no-mmproj-offload
      #--image-min-tokens 1024
      --chat-template-file ${model_dir}/Qwen3.8-27B/Qwen3.8.unsloth.fixed.chat_template

  "Qwen3.8-27b-uncensored":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --model ${model_dir}/Qwen3.8-27B/Qwen3.8-27B-OBLITERATED-Q4_K_M.gguf
      --temp 0.2
      --repeat-penalty 1.15
      --ctx-size 128000
      #-n 2048 #ONLY FOR SHORT AGENTIC LOOPS

  "Qwen3.6-35b-3a":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --model ${model_dir}/Qwen3.6-35B-3A/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --mmproj ${model_dir}/Qwen3.6-35B-3A/mmproj-BF16.gguf
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00 --ctx-size 256000
      # --no-mmproj-offload
      --chat-template-kwargs '{"preserve_thinking": true}'
      --image-min-tokens 1024
# ----------------------------------------------------------------------------------------------------------------


# Gemma4 models

  "Gemma4-31B":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --image-min-tokens 560
      --image-max-tokens 2240
      --model ${model_dir}/Gemma4-31B/gemma-4-31B-it-IQ4_XS.gguf
      --model-draft ${model_dir}/Gemma4-31B/mtp-gemma-4-31B-it.gguf
      #--mmproj ${model_dir}/Gemma4-31B/mmproj-BF16.gguf
      --spec-type draft-mtp --spec-draft-n-max 3
      --temp 1.0 --top-p 0.95 --top-k 64 --ctx-size 32000

  "Gemma4-26B-4A":
    ttl: 900
    cmd: |
      ${bin} ${base_args}
      --image-min-tokens 560
      --image-max-tokens 2240
      --model ${model_dir}/Gemma4-26B-4A/google_gemma-4-26B-A4B-it-Q4_K_M.gguf
      --mmproj ${model_dir}/Gemma4-26B-4A/mmproj-google_gemma-4-26B-A4B-it-bf16.gguf
      --temp 1.0 --top-p 0.95 --top-k 64 --ctx-size 256000
